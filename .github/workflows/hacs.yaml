name: HACS structure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
# HACS does not support private repositories. Keep this only for a future public release.
